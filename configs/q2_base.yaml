app:
  name: "resource_aware_image_encryption"
  version: "0.3.0"
  log_level: "INFO"

image:
  block_size: 16
  channels: 3

budget:
  default_time: 1000.0
  cost_none: 0.0
  cost_low: 1.0
  cost_medium: 3.0
  cost_high: 10.0

encryption:
  master_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  levels:
    high:
      algorithm: "AES-GCM"
      chaos_rounds: 2
    medium:
      algorithm: "ChaCha20-Poly1305"
      chaos_rounds: 1
    low:
      algorithm: "None"
      chaos_rounds: 1

policy:
  scorer: "rule_based"
  rule_mode: "entropy"
  thresholds: [0.3, 0.7]
  fusion_alpha: 0.7
  semantic:
    semantic_mode: "dinov2"
    model_name: "facebook/dinov2-small"
    model_path: ""
    backend: "huggingface"
    require_real_backend: false
    alpha: 0.5
    beta: 0.5
    device: "auto"
    use_pretrained: true
    fallback_enabled: true
    batch_size: 16
    contrast_weight: 0.8
    norm_weight: 0.2
    calibrate_semantic: true

chaos:
  backend: "aes_ctr"
  seed: 42
  r: 3.99

experiment:
  random_seed: 42
  status_values:
    - DEGRADED
    - PARTIAL
    - FULL
  mandatory_csv_columns:
    - method
    - mode
    - budget_limit
    - budget_used
    - budget_utilization
    - status
    - time_ms
    - high_count
    - medium_count
    - low_count
    - none_count
    - high_ratio
    - medium_ratio
    - low_ratio
    - none_ratio
    - timestamp
  optional_csv_columns:
    - alpha
    - entropy
    - npcr
    - uaci
    - correlation_h
    - correlation_v
    - correlation_d
    - plain_cipher_corr
    - pearson_rule_final
    - pearson_sem_final
    - topk_overlap_rule
    - topk_overlap_sem
    - category
    - image
    - n_blocks
