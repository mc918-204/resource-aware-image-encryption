# V-J fair timing reproduction with per-block DINOv2 FP16 autocast.
# FP16 is scoped to CUDA inference; semantic scoring and allocation stay float32.
app:
  name: "resource_aware_image_encryption"
  version: "0.3.0"
  log_level: "INFO"

image:
  block_size: 16
  channels: 3

budget:
  default_time: 1000.0
  cost_none: 0.0
  cost_low: 1.0
  cost_medium: 3.0
  cost_high: 10.0

encryption:
  master_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  kdf_profile: "v2_domain_separated"
  levels:
    high:
      algorithm: "AES-GCM"
      chaos_rounds: 2
    medium:
      algorithm: "ChaCha20-Poly1305"
      chaos_rounds: 1
    low:
      algorithm: "None"
      chaos_rounds: 1

policy:
  scorer: "semantic_fusion"
  rule_mode: "entropy"
  thresholds: [0.3, 0.7]
  fusion_alpha: 0.7
  semantic:
    semantic_mode: "dinov2"
    semantic_encode_mode: "per_block"
    model_name: "facebook/dinov2-small"
    model_revision: "ed25f3a31f01632728cabb09d1542f84ab7b0056"
    model_path: ""
    backend: "huggingface"
    require_real_backend: true
    fallback_enabled: false
    alpha: 0.8
    beta: 0.2
    device: "cuda"
    use_pretrained: true
    use_fp16: true
    batch_size: 32
    contrast_weight: 0.8
    norm_weight: 0.2
    calibrate_semantic: false

chaos:
  backend: "aes_ctr"
  seed: 42
  r: 3.99

experiment:
  random_seed: 20261010
  status_values: ["DEGRADED", "PARTIAL", "FULL"]
