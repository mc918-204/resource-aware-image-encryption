experiment_name: "m4_plus_sota_smoke"
stage: "publication_smoke"
output_root: "results/m4_plus_runs"
checkpoint_enabled: true
checkpoint_every_records: 10

dataset_manifest: "results/manifests/publication_manifest.csv"
sampling_mode: "subset_100"
sample_total: 8
sampling_seed: 0
include_datasets:
  - "kodak"
  - "usc_sipi"
  - "div2k"
  - "coco_subset"

budget_type: "time"
budgets: [0.1]
seeds: [0]

references:
  - "no_protection"
  - "full_aead"

main:
  - "random_selective"
  - "proposed_semantic_real_threshold"
  - "saliency_roi_strong_aead"
  - "semantic_roi_external_proxy"

ablation:
  - "semantic_fallback"

supplementary_privacy:
  - "blur_sensitive_region_proxy"

methods:
  - "no_protection"
  - "full_aead"
  - "random_selective"
  - "proposed_semantic_real_threshold"
  - "semantic_fallback"
  - "saliency_roi_strong_aead"
  - "semantic_roi_external_proxy"
  - "blur_sensitive_region_proxy"

require_real_semantic: true
allow_fallback_as_main: false
allow_debug_dataset: false
attack_metrics_enabled: true
statistical_validation_enabled: false
config_path: "configs/q2_base.yaml"
dinov2_readiness_path: "results/readiness/dinov2_ready.json"

policy_overrides:
  scorer: "rule_based"
  semantic:
    semantic_mode: "dinov2"
    backend: "huggingface"
    require_real_backend: true
    fallback_enabled: false
    model_path: "huggingface/hub/models--facebook--dinov2-small/snapshots/ed25f3a31f01632728cabb09d1542f84ab7b0056"
    device: "cuda"

selective_metric_config:
  topk: 5
  strong_levels: ["high"]
  protection_weights:
    high: 1.0
    medium: 0.6
    low: 0.3
    none: 0.0
  block_size: 16
