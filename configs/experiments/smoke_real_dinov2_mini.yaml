# Mini smoke: 3 images, 2 methods (rule + real DINOv2), 1 budget, 1 seed.
# Goal: verify end-to-end pipeline produces raw_results.csv with metric_errors empty
# AND semantic_backend=dinov2_huggingface.

experiment_name: "smoke_real_dinov2_mini"
stage: "validation"
output_root: "results/smoke_real_dinov2"
config_path: "configs/q2_base.yaml"
budget_type: "time"

dataset_manifest: "results/manifests/publication_manifest.csv"
sampling_mode: "legacy_category_cap"
sampling_seed: 0
max_images_per_category: 3

methods:
  - no_protection
  - full_aead
  - rule_based_legacy
  - proposed_semantic_real_threshold

budgets:
  - budget_ratio: 0.1

seeds:
  - 0

require_real_semantic: true
allow_fallback_as_main: false
allow_debug_dataset: false
dinov2_readiness_path: "results/readiness/dinov2_ready.json"

policy_overrides:
  scorer: "rule_based"
  semantic:
    semantic_mode: "dinov2"
    backend: "huggingface"
    require_real_backend: true
    fallback_enabled: false
    model_path: "huggingface/hub/models--facebook--dinov2-small/snapshots/ed25f3a31f01632728cabb09d1542f84ab7b0056"
    device: "cuda"

selective_metric_config:
  topk: 5
  strong_levels: ["high"]
  protection_weights:
    high: 1.0
    medium: 0.6
    low: 0.3
    none: 0.0
  block_size: 16

attack_metrics_enabled: true
statistical_validation_enabled: false
