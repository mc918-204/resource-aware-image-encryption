    require_real_backend: true
    fallback_enabled: false
    model_path: huggingface/hub/models--facebook--dinov2-small/snapshots/ed25f3a31f01632728cabb09d1542f84ab7b0056
    device: cuda
    semantic_encode_mode: per_block
selective_metric_config:
  topk_mode: ratio
  strong_levels:
  - high
  - medium
  protection_weights:
    high: 1.0
    medium: 0.5
    low: 0.0
    none: 0.0
  block_size: 16
roundtrip_verify_ratio: 1.0
traditional_metrics_enabled: false
attack_metrics_enabled: false
statistical_validation_enabled: true
