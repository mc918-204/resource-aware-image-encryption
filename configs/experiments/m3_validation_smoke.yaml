# M3-A Validation Smoke Benchmark Configuration
# This is a minimal smoke test configuration for M3 validation.
# Uses debug dataset, 1 image per category, 1 budget, 1 seed.
# Does NOT run real semantic unless DINOv2 readiness passes.

experiment_name: "m3_validation_smoke"
stage: "validation"
output_root: "results/m3_validation_runs"
config_path: "configs/q2_base.yaml"
budget_type: "time"

dataset_manifest: "results/manifests/debug_train_manifest.csv"
max_images_per_category: 1

methods:
  - no_protection
  - full_aead
  - random_selective
  - rule_based_legacy
  - semantic_fallback
  - proposed_semantic_fallback_threshold

budgets:
  - budget_ratio: 0.1

seeds:
  - 0

require_real_semantic: false
dinov2_model_path: ""
dinov2_device: "cpu"

selective_metric_config:
  topk: 5
  strong_levels:
    - high
  protection_weights:
    high: 1.0
    medium: 0.5
    low: 0.2
    none: 0.0

policy_overrides:
  semantic:
    semantic_mode: "fallback"
    fallback_enabled: true
    require_real_backend: false
    calibrate_semantic: false
